<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HospiSoft — Iniciar sesión</title>
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--clr-light);">

  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card border-0 shadow-sm rounded-3" style="width:100%;max-width:400px;">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-2" style="width:56px;height:56px;background:var(--clr-light);color:var(--clr-text);font-size:1.5rem;">
            <i class="fas fa-hospital"></i>
          </div>
          <div class="fw-bold fs-4 lh-1" style="color:var(--clr-text);">HospiSoft</div>
          <small class="text-muted">Sistema Hospitalario</small>
        </div>

        <div id="login-status" class="alert alert-secondary small mb-3 d-none" role="status"></div>

        <form id="login-form" method="post" onsubmit="return false" novalidate>
          <div class="mb-3">
            <label for="login-username" class="form-label small text-muted">Usuario</label>
            <input type="text" class="form-control" id="login-username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="login-password" class="form-label small text-muted">Contraseña</label>
            <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="alert alert-danger small py-2 d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit">
            <i class="fas fa-sign-in-alt me-1"></i>Ingresar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
