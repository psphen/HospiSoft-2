# Apache POI logs through the Log4j API but the application ships no Log4j implementation.
# Pointing the API at its built-in simple logger avoids the "could not find a logging provider"
# error at startup; only POI errors (if any) reach the console.
log4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory
log4j2.simplelogLevel=ERROR
